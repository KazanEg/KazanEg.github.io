<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصنع تجريبي | كل اللينكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5f4;--card:#fff;--text:#14201c;--muted:#5d6b66;--brand:#0f6b4f;--accent:#f2b705;--line:#dde3e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17211d;--text:#eef3f0;--muted:#9aaba4;--brand:#3fbf94;--accent:#f2b705;--line:#26352f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
main{max-width:480px;margin:0 auto;padding:36px 0 28px}
.logo{width:96px;height:96px;border-radius:24px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:800;margin:0 auto 14px;border-bottom:6px solid var(--accent)}
h1{font-size:26px;font-weight:800;text-align:center;margin:0 0 4px}
.tag{text-align:center;color:var(--muted);margin:0 0 28px;font-size:15px}
.links{display:flex;flex-direction:column;gap:12px}
a.l{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--text);text-decoration:none;font-weight:600;font-size:17px;transition:transform .15s,border-color .15s}
a.l:hover,a.l:focus-visible{border-color:var(--brand);transform:translateY(-2px);outline:none}
a.l.main{background:var(--brand);color:#fff;border-color:var(--brand)}
.ic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.main .ic{background:rgba(255,255,255,.18)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
@media (prefers-reduced-motion:reduce){a.l{transition:none}}
</style>
</head>
<body>
<main>
  <div class="logo">م</div>
  <h1>مصنع تجريبي</h1>
  <p class="tag">تصنيع وتوريد — 6 أكتوبر</p>
  <nav class="links">
    <a class="l main" href="https://wa.me/201000000000"><span class="ic">💬</span>كلمنا على واتساب</a>
    <a class="l" href="tel:+201000000000"><span class="ic">📞</span>اتصل بينا</a>
    <a class="l" href="https://example.com/catalog.pdf"><span class="ic">📄</span>كتالوج المنتجات (PDF)</a>
    <a class="l" href="https://example.com"><span class="ic">🌐</span>الموقع الإلكتروني</a>
    <a class="l" href="https://facebook.com/example"><span class="ic">👍</span>صفحتنا على فيسبوك</a>
    <a class="l" href="https://instagram.com/example"><span class="ic">📷</span>إنستجرام</a>
    <a class="l" href="https://maps.google.com/?q=6th+of+October+City"><span class="ic">📍</span>موقع المصنع على الخريطة</a>
    <a class="l" href="mailto:info@example.com"><span class="ic">✉️</span>info@example.com</a>
  </nav>
  <footer>نسخة تجريبية — البيانات وهمية</footer>
</main>
</body>
</html>
